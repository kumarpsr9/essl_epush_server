services:
  webapp:
    build:
      context: ./iclock_server
      dockerfile: Dockerfile
    image: iclock
    ports:
      - 8888:8080
    restart: always
    volumes:
        - ./logfile.txt:/usr/local/tomcat/webapps/iclock/WEB-INF/logfile.txt

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: epush-api
    env_file: .env
    environment:
      # The container always listens on 3000; API_PORT in .env picks the host port.
      API_PORT: 3000
    ports:
      - ${API_PORT:-3000}:3000
    restart: always
